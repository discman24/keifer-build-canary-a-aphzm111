<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keifer Canary A - Pipeline Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #2f3349 0%, #1e1e2e 100%);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
            background: rgba(51, 65, 85, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 16px;
            padding: 3rem 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        h1 {
            font-size: clamp(1.8rem, 4vw, 2.5rem);
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 1rem;
            margin-bottom: 2rem;
            font-weight: 400;
        }

        .greeting {
            font-size: 1.25rem;
            margin-bottom: 2rem;
            color: #cbd5e1;
            min-height: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .time-display {
            font-size: 1.125rem;
            color: #fbbf24;
            font-weight: 600;
            margin-bottom: 2rem;
            min-height: 1.5rem;
            font-family: 'Courier New', monospace;
            background: rgba(251, 191, 36, 0.1);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid rgba(251, 191, 36, 0.2);
        }

        .btn {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #1e293b;
            border: none;
            padding: 0.875rem 2rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            text-transform: uppercase;
            letter-spacing: 0.025em;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            background: linear-gradient(135deg, #f59e0b, #d97706);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:focus {
            outline: 2px solid #fbbf24;
            outline-offset: 2px;
        }

        .status {
            margin-top: 2rem;
            padding: 1rem;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.2);
            border-radius: 8px;
            color: #4ade80;
            font-size: 0.875rem;
        }

        @media (max-width: 480px) {
            .container {
                padding: 2rem 1.5rem;
                margin: 1rem;
            }
            
            .btn {
                padding: 1rem 1.5rem;
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>Keifer Canary A</h1>
        <p class="subtitle">Pipeline Test Page</p>
        
        <div class="greeting" id="greeting" aria-live="polite"></div>
        
        <div class="time-display" id="timeDisplay" aria-live="polite">
            Click the button to see current UTC time
        </div>
        
        <button class="btn" id="showTimeBtn" aria-describedby="timeDisplay">
            Show Current Time
        </button>
        
        <div class="status">
            <strong>Status:</strong> Pipeline Phase A - Active
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const greetingEl = document.getElementById('greeting');
            const timeDisplayEl = document.getElementById('timeDisplay');
            const showTimeBtnEl = document.getElementById('showTimeBtn');
            
            // Show greeting immediately
            greetingEl.textContent = 'Hello from Keifer Canary A!';
            
            showTimeBtnEl.addEventListener('click', function() {
                const now = new Date();
                const utcTime = now.toISOString();
                const formattedTime = now.toUTCString();
                
                timeDisplayEl.textContent = `UTC: ${formattedTime}`;
                
                // Add a subtle animation
                timeDisplayEl.style.transform = 'scale(1.02)';
                setTimeout(() => {
                    timeDisplayEl.style.transform = 'scale(1)';
                }, 200);
            });
        });
    </script>
</body>
</html>
